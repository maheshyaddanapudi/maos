version: "3.9"

services:
  maos:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      - MAOS_CONFIG=/app/config/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maos
      POSTGRES_USER: maos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maos_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
