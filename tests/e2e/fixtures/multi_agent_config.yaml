llms:
  default:
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.3

agents:
  supervisor:
    kind: supervisor
    llm: default
    system_prompt: |
      You are a supervisor that routes tasks to specialized workers.

      Analyze user requests and delegate to the most appropriate worker.
      Use send_message if you need clarification from the user.

      After a worker completes their task, decide if you need another worker
      or if the task is complete.

  math_expert:
    kind: native_worker
    llm: default
    system_prompt: |
      You are a math expert. Solve mathematical problems step by step.
      Be precise and show your work. Give the final answer clearly.
    description: Solves mathematical problems and calculations

  writer:
    kind: native_worker
    llm: default
    system_prompt: |
      You are a creative writer. Generate engaging and well-structured text.
      Be creative but concise.
    description: Creative writing and text generation
